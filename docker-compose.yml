services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_DB: media_pipeline, POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres }
    ports: ["5432:5432"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres -d media_pipeline"], interval: 5s, timeout: 3s, retries: 10 }
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 10 }
  api:
    build: .
    command: sh -c "npx prisma migrate deploy && node dist/server.js"
    ports: ["3000:3000"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/media_pipeline?schema=public
      REDIS_URL: redis://redis:6379
    volumes: ["./uploads:/app/uploads"]
    depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_healthy } }
  worker:
    build: .
    command: sh -c "npx prisma migrate deploy && node dist/queue/analysis.worker.js"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/media_pipeline?schema=public
      REDIS_URL: redis://redis:6379
    volumes: ["./uploads:/app/uploads"]
    depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_healthy } }
